services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: autoria_db
      POSTGRES_USER: autoria_user
      POSTGRES_PASSWORD: autoria_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dumps:/dumps:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoria_user -d autoria_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  scraper:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Виправлений URL - порт 5432 всередині контейнера
      - DATABASE_URL=postgresql://autoria_user:autoria_pass@postgres:5432/autoria_db
      - SCRAPER_START_TIME=12:00
      - LOG_LEVEL=INFO
    volumes:
      - ./dumps:/app/dumps:rw
      - ./logs:/app/logs:rw
    restart: unless-stopped
    command: >
      sh -c "sleep 5 && 
             python test_db.py &&
             tail -f /dev/null"  # Замініть на це для тесту

volumes:
  postgres_data: